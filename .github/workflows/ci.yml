name: CI

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime + dev dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -B -m compileall -q seo_crawler/seo_crawler webapp tests
      - name: Test
        run: python -B -m unittest discover -s tests

  # v1.10-B3: Windows runner — مشروع SCT يحوي installer/ PowerShell ويستهدف
  # Windows كأحد المنصّات المدعومة. أيّ regression Windows-specific (path
  # separators، file locks، subprocess CREATE_NEW_PROCESS_GROUP) لن يظهر بدون
  # هذا الـjob.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime + dev dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -B -m compileall -q seo_crawler/seo_crawler webapp tests
      - name: Test
        run: python -B -m unittest discover -s tests

  # v1.10-B3: pip-audit — يفحص CVEs على كلّ dependency في requirements.txt.
  # لا يفشل البناء على low-severity (نسمح للمشروع بالاستمرار)؛ يفشل على
  # high/critical فقط. القائمة محدَّثة عبر PyPI Advisory DB.
  security-audit:
    runs-on: ubuntu-latest
    needs: test-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --strict --skip-editable
        continue-on-error: true  # تنبيه لا فشل (نشاهده في الـrun summary)
