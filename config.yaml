# ============================================================
# إعدادات SCT الافتراضية
# ============================================================
# عدّل القيم هنا بدلاً من تعديل الكود
# ============================================================

# === معلومات الموقع المستهدف ===
site:
  start_url: "https://example.com/"
  domain: "example.com"
  # نطاقات إضافية تُعتبر "داخلية" (إن وُجدت)
  additional_internal_domains: []
  # مثال: ["shop.example.com", "blog.example.com"]
  # قالب منصّة تجارة جاهز (IMP-11): "" أو zid | salla | shopify | woocommerce
  platform_preset: ""

# === إعدادات الزحف العامة ===
crawl:
  # الحد الأقصى لعدد الصفحات (0 = بلا حد)
  max_pages: 5000

  # الحد الأقصى للعمق من الصفحة الرئيسية
  max_depth: 15

  # التأخير بين كل طلب (بالثواني) - مهم لعدم إرهاق السيرفر
  delay_seconds: 0.5

  # المهلة الزمنية لكل طلب (بالثواني)
  timeout_seconds: 15

  # عدد مرات إعادة المحاولة عند الفشل
  retry_attempts: 3

  # التأخير بين إعادات المحاولة (بالثواني)
  retry_delay_seconds: 2

  # احترام robots.txt
  respect_robots: true

  # ماذا نفعل إذا تعذّر تحميل robots.txt؟ allow | deny
  # في أوضاع المنافسة/المقارنة يتم ضبطها إلى deny تلقائياً.
  robots_failure_policy: "allow"

  # استراتيجية اكتشاف الروابط:
  #   homepage = من الصفحة الرئيسية واتباع الروابط فقط
  #   sitemap  = من sitemap أولاً (تغطية واسعة للمنتجات)
  #   hybrid   = الرئيسية + الروابط أولاً ثم sitemap كداعم (موصى به)
  seed_strategy: "hybrid"

  # التحقق من شهادات HTTPS؛ عطّله فقط للتشخيص عند مواقع داخلية بشهادات self-signed
  verify_ssl: true

  # السماح بزحف عناوين داخلية/loopback (مثل localhost). اتركه false لحماية SSRF،
  # وفعّله فقط عند تدقيق مواقع داخلية موثوقة.
  allow_private_hosts: false

  # === Async Crawling (v3.0) ===
  # عدد الطلبات المتزامنة - يحدد سرعة الزحف
  # 5 = آمن، 10 = متوسط، 20 = سريع (قد يُحجَب)
  concurrent_requests: 5

  # User-Agent للزحف
  user_agent: "SCTBot/1.0 (+SEO Audit; contact@example.com)"

  # الحد الأقصى لحجم الصفحة (بالميغابايت) - تجاهل الصفحات الأكبر
  max_page_size_mb: 10

  # هل نتبع redirects تلقائياً؟ (recommended: true)
  follow_redirects: true

  # الحد الأقصى لعدد redirect chain hops
  max_redirect_hops: 5

  # === تحكّم تكيّفي بالسرعة (IMP-10) ===
  # يزيد التأخير تلقائياً عند 429/5xx/استجابة بطيئة ويتعافى عند تحسّن الموقع.
  adaptive_throttle:
    enabled: false
    min_delay: 0.0
    max_delay: 5.0
    step_up: 0.5
    step_down: 0.25
    slow_ms: 3000

# === JavaScript Rendering ===
javascript:
  # تفعيل JS rendering (مهم لمواقع زد) — يحتاج: playwright install chromium
  # يجعل الزحف أبطأ ~5-10x لكنه يلتقط المحتوى/الروابط الديناميكية
  enabled: false

  # وضع التصيير: all (كل الصفحات) | sample (عيّنة حتى max_pages) | on_empty_content
  mode: "sample"

  # أقصى عدد صفحات تُصيَّر (0 = بلا حد)
  max_pages: 100

  # عدد عمليات التصيير المتزامنة (المتصفح ثقيل)
  concurrency: 2

  # في وضع on_empty_content: تُصيَّر الصفحة إذا قلّ نصها الخام عن هذا الحد
  empty_content_words: 50

  # حظر أنواع موارد لتسريع التصيير (مثل: ["image","font","media"])
  block_resource_types: []

  # طريقة الانتظار: networkidle | domcontentloaded | load
  wait_until: "networkidle"

  # المهلة لانتظار JS (بالثواني)
  timeout: 10

  # اسم المتصفح: chromium | firefox | webkit
  browser: "chromium"

  # هل نرى المتصفح؟ (false = headless)
  headless: true

# === فحص الوصولية (axe-core) — اختياري، يتطلّب javascript.enabled ===
accessibility:
  enabled: false
  max_pages: 50            # سقف الصفحات التي يُفحَص فيها axe
  axe_source: ""           # مسار محلي لـ axe.min.js (موصى به للعمل دون إنترنت)
  cdn_url: ""              # رابط CDN بديل (الافتراضي jsdelivr عند allow_cdn)
  allow_cdn: false         # السماح بجلب axe-core من CDN عند غياب الملف المحلي

# === إعدادات الاستخراج ===
extraction:
  extract_meta: true
  extract_headings: true
  extract_links: true
  extract_images: true
  extract_schema: true
  extract_hreflang: true
  extract_og: true
  extract_canonical: true
  extract_pagination: true   # روابط ترقيم الصفحات rel=next/prev
  extract_headers: true
  extract_content: true

  # هل نستخرج روابط الموارد (CSS, JS, etc.)؟
  extract_resources: false

  # فحص حالة HTTP لكل مورد (CSS/JS/صور…) — مكلف، مطفأ افتراضياً.
  # يتطلّب extract_resources: true ويعيد استخدام فاحص الروابط الخارجية.
  check_resource_status: false

  # كشف HTTP resources داخل صفحات HTTPS
  extract_mixed_content: true

# === الاستخراج المخصّص (الخطة #5) — معطّل افتراضياً ===
custom_extraction:
  enabled: false
  rules:
    # - name: product_price
    #   type: css
    #   selector: ".price"
    #   extract: text           # text | attr | html
    # - name: canonical_href
    #   type: css
    #   selector: "link[rel='canonical']"
    #   extract: attr
    #   attr: href
    # - name: sku
    #   type: regex
    #   pattern: 'SKU:\s*([A-Z0-9-]+)'
    #   group: 1

  # الحد الأدنى لطول النص الذي يُعتبر "محتوى" (بالحروف)
  min_content_length: 50

# === المرشحات (Filters) ===
filters:
  # أنماط URLs لاستبعادها من الزحف
  exclude_patterns:
    - "/cart"
    - "/checkout"
    - "/account"
    - "/login"
    - "/register"
    - "/logout"
    - "?add-to-cart="
    - "?remove-item="
    - "/wp-admin/"
    - "/wp-json/"
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".xls"
    - ".xlsx"
    - ".zip"
    - ".rar"
    - "#"
    - "mailto:"
    - "tel:"
    - "javascript:"

  # أنماط URLs لزحفها فقط (إذا كانت فارغة، يُزحف كل شيء)
  include_patterns: []

  # أنواع MIME المسموح بزحفها
  allowed_content_types:
    - "text/html"
    - "application/xhtml+xml"

  # هل نتبع الروابط nofollow؟
  respect_nofollow: false

  # هل نتبع الروابط الخارجية للتحقق من الـ status فقط؟
  check_external_links: true

# === التحليلات ===
analysis:
  # الحد الأدنى لعدد الكلمات (أقل منه = thin content)
  thin_content_threshold: 300

  # الحد الحرج للكلمات (أقل منه = محتوى رقيق حرج)
  thin_content_critical_threshold: 100

  # الحد الأدنى لنسبة Text-to-HTML (أقل منه = نسبة منخفضة)
  text_ratio_threshold: 10.0

  # الحد الأقصى لطول Title بالحروف
  title_max_length: 60
  title_min_length: 30

  # الحد الأقصى لطول Meta Description بالحروف
  description_max_length: 160
  description_min_length: 70

  # الحد الأقصى لحجم الصورة الموصى به (KB)
  image_max_size_kb: 200

  # عمق الصفحة الحرج (أكثر منه = صفحة عميقة جداً)
  max_recommended_depth: 4

  # URL hygiene checks
  url_max_length: 115
  url_max_query_params: 5
  # هل نعتبر الروابط non-ASCII (مثل العربية) مشكلة؟ false = معلومة فقط (موصى به للمواقع العربية)
  url_flag_non_ascii: false

# === الإخراج ===
output:
  # المسار الذي تُحفظ فيه الملفات
  output_dir: "./output"

  # الصيغ المطلوبة. XML مطفأ افتراضياً لأنه يكرّر بيانات CSV نفسها (لا معلومات
  # إضافية)؛ أضِفه يدوياً عند الحاجة. مجلد csv/ هو موطن البيانات الكاملة.
  formats:
    - csv
    - excel
    - json

  # الترميز للملفات (utf-8-sig يحل مشاكل العربية في Excel)
  encoding: "utf-8-sig"

  # هل نضيف timestamp لاسم المجلد؟
  timestamped_folder: true

  # أرشيف JSON كامل؟ false (موصى به) = لا نُضمّن المصفوفات الخام الضخمة
  # (روابط/صور/عناوين) في complete_audit.json — متوفّرة كاملةً في CSV/Excel/XML.
  # true يُضمّنها وقد يبلغ الملف غيغابايتات على المواقع الكبيرة.
  json_full: false

  # سقف صفوف XML لكل مجموعة (يمنع ملفات XML بحجم غيغابايت). 0 = بلا حد.
  xml_max_rows: 50000

  # توليد sitemap.xml نظيف من الصفحات القابلة للفهرسة (IMP-5)
  generate_sitemap: false

# === تقرير HTML/PDF (يُستخدم عند إضافة html/pdf إلى output.formats) ===
report:
  language: "ar"          # ar | en
  audience: "expert"      # expert (تفصيلي) | client (مختصر مبسّط) | both (تقريران)
  client_name: ""         # يظهر في غلاف التقرير
  logo_url: ""            # شعار اختياري
  max_rows: 100           # حد صفوف الجداول في التقرير
  unified: true           # تقرير موحّد: تقني + GSC + GA4 + أولويات متقاطعة

# === حفظ الحالة (Resume Support) ===
state:
  # المسار لحفظ تقدم الزحف
  state_dir: "./state"

  # كم صفحة بين كل حفظ تلقائي
  save_interval: 50

  # هل نستأنف من آخر جلسة محفوظة؟
  resume_if_exists: true

  # === v3.0: SQLite Storage ===
  # استخدام SQLite بدلاً من الذاكرة (موصى به للمواقع الكبيرة)
  # المزايا: استهلاك ذاكرة أقل، queries سريعة، آمان أكبر
  use_database: true

  # === v3.0: API Cache TTL ===
  # عدد أيام صلاحية الـ cache للـ APIs (PageSpeed, GSC)
  # 7 أيام افتراضي - يوفّر quota الـ API
  cache_ttl_days: 7

# === v3.0: External Links Check ===
external_check:
  # تفعيل فحص الروابط الخارجية
  enabled: true

  # تسريع على المواقع الضخمة: عيّنة لكل host (يفحص رابطاً واحداً لكل نطاق خارجي).
  # افتراضياً مفعّل لأن الغالبية تكرار لنفس المنصّات (شبكات/CDN) — يوفّر >90% من الوقت
  # بدون فقدان معلومة فعلية. أوقفه إن أردت فحص كل رابط فردياً.
  sample_per_host: true

  # سقف إجمالي للروابط الخارجية المفحوصة (0 = بلا حد). يُطبَّق بعد العيّنة.
  max_urls: 0

  # المهلة لكل رابط (بالثواني)
  timeout: 10

  # عدد الطلبات المتزامنة
  concurrent: 20

  # عدد محاولات إعادة المحاولة
  retry_attempts: 2

  # التحقق من شهادات HTTPS للروابط الخارجية
  verify_ssl: true

# === التكاملات (تُفعَّل عند توفّر APIs) ===
integrations:
  gsc:
    enabled: false
    credentials_file: "credentials/gsc_credentials.json"
    site_url: "https://example.com/"
    # عدد الأشهر الماضية للجلب
    months_back: 16
    # حالة الفهرسة الحقيقية لكل رابط عبر URL Inspection API (IMP-2)
    # يحترم الحصّة اليومية عبر السقف؛ لا PII.
    url_inspection: false
    inspect_max_urls: 50

  pagespeed:
    enabled: false
    api_key: ""  # سيُقرأ من .env إذا كان فارغاً
    # عدد الـ URLs لفحصها. كل URL يستغرق 20-30 ثانية × 2 (mobile+desktop).
    # على موقع 5000 صفحة بـmax_urls=0 يستغرق ~3 أيام! اضبطها بعناية:
    #   25 = ~25 دقيقة (موصى به لتقييم تمثيلي)
    #   100 = ~1.5 ساعة  |  500 = ~8 ساعات  |  0 = بلا حد (لا تستخدمه على موقع كبير)
    max_urls: 25
    # حفظ تقرير Lighthouse الكامل (JSON خام) لكل صفحة في output/pagespeed_raw/
    # للتحليل العميق (كل عمليات التدقيق والتشخيصات). كبير الحجم.
    save_raw_json: false
    # التأخير بين كل طلب PageSpeed
    delay_seconds: 1
    # === v3.0: عمر الـ cache لنتائج PageSpeed (بالأيام) ===
    # يوفّر quota الـ API (الحد المجاني 25K/يوم)
    cache_ttl_days: 7
    # اتجاه Core Web Vitals عبر الزمن من CrUX History (IMP-9) — يستعمل نفس api_key
    crux_history: false
    # الاستراتيجيات: mobile, desktop, both
    strategies:
      - mobile
      - desktop

  awt:
    enabled: false
    # المسار لمجلد CSVs المُصدَّرة من Ahrefs Webmaster Tools
    csv_folder: "./external_data/awt"

  # استيراد نتائج Lighthouse/PageSpeed (ملفات JSON) — بلا مفاتيح/إنترنت
  # شغّل Lighthouse CLI محلياً وضع ملفات JSON في المجلد ثم فعّل الخيار.
  lighthouse:
    enabled: false
    folder: "./external_data/lighthouse"

  # Google Analytics 4 (سلوك المستخدم) — اختياري، بمفاتيحك أنت
  # يحتاج: pip install google-analytics-data
  ga4:
    enabled: false
    property_id: ""        # رقم خاصية GA4 (أو من GA4_PROPERTY_ID في .env)
    credentials_file: ""   # service account JSON (أو GA4_CREDENTIALS_FILE في .env)
    date_range_days: 90

  bing_webmaster:
    enabled: false
    csv_folder: "./external_data/bing"

  # === مستشار الذكاء الاصطناعي (اختياري، مطفأ افتراضياً) ===
  # يقرأ ملخّص التدقيق ويقترح تحسينات. المفتاح لا يُخزَّن في المستودع؛ ضعه في .env
  # كـ AI_API_KEY أو هنا محلياً فقط. المزوّدات: openai | deepseek | openrouter |
  # huggingface | gemini | openai_compatible (لنقطة مخصّصة/محلية).
  ai:
    enabled: false
    provider: "openai"
    api_key: ""            # أو من AI_API_KEY في .env (يُفضّل)
    model: ""              # فارغ = الافتراضي لكل مزوّد
    base_url: ""           # فارغ = الافتراضي؛ مطلوب لـ openai_compatible
    allow_private: false   # السماح بعنوان داخلي/محلي (نماذج محلية)؛ يرفع حماية SSRF
    timeout: 60
    max_opportunities: 15  # كم فرصة عليا تُرسَل للنموذج

# === السجلات (Logging) ===
logging:
  # المستوى: DEBUG | INFO | WARNING | ERROR | CRITICAL
  level: "DEBUG"

  # المسار لمجلد السجلات
  log_dir: "./logs"

  # هل نطبع السجلات على Console أيضاً؟
  console_output: true

  # هل نكتب ملف log؟ إيقافه يمنع إنشاء logs/ لمجرد --help أو الاستيراد.
  file_output: true

  # الحد الأقصى لحجم ملف السجل (بالميغابايت)
  max_log_size_mb: 50

# === المراقبة وقياس الأداء (Observability) ===
observability:
  # يفعّل counters/timings/gauges وكتابة metrics.json داخل مجلد المخرجات.
  enabled: true

  # يسجل بداية/نهاية الدوال والمراحل المراقبة عند مستوى DEBUG.
  # ارفع logging.level إلى DEBUG لرؤية كل التفاصيل في ملف اللوغ.
  log_function_calls: true

  # يسجل أحداث كل URL/رابط خارجي. مفيد للتقييم العميق وقد يكون كثيراً في المواقع الكبيرة.
  log_url_events: true

  # يسجل توقيت كل extractor مثل meta/headings/schema/links/images.
  log_extraction_details: true

  # أي استدعاء يتجاوز هذا الحد يُعدّ بطيئاً.
  slow_call_ms: 500

  # تجميع النداءات البطيئة في ملخص نهائي بدل تحذير لكل نداء (يقلّل ضجيج اللوغ).
  slow_call_summary: true

# === وضع المقارنة v3.0: قائمة المواقع للمقارنة ===
# يُستخدم فقط مع: python main.py --mode compare
sites_to_compare:
  - url: "https://example.com/"
    label: "Example"
    is_primary: true
