# SCT public example configuration.
# Copy to config.yaml and adjust for your own website.

site:
  start_url: "https://example.com/"
  domain: "example.com"
  additional_internal_domains: []
  # Ready-made platform preset (IMP-11 + v1.13.5): "" or zid | salla | shopify | woocommerce | wordpress
  # Stores: excludes cart/checkout/account; wordpress: excludes wp-admin/feed/replytocom/author/tag.
  # Merges patterns without erasing what you set in filters.exclude_patterns.
  platform_preset: ""

crawl:
  max_pages: 500
  max_depth: 8
  delay_seconds: 0.5
  timeout_seconds: 15
  retry_attempts: 3
  retry_delay_seconds: 2
  respect_robots: true
  robots_failure_policy: "allow"
  # homepage | sitemap | hybrid (recommended)
  seed_strategy: "hybrid"
  verify_ssl: true
  # Allow crawling internal/loopback hosts. Keep false for SSRF protection.
  allow_private_hosts: false
  concurrent_requests: 5
  user_agent: "SCTBot/1.0 (+https://github.com/Ahmad-Ajm/SCT)"
  max_page_size_mb: 10
  follow_redirects: true
  max_redirect_hops: 5
  # Adaptive rate control (IMP-10): increases delay on 429/5xx/slowness and recovers automatically.
  adaptive_throttle:
    enabled: false
    min_delay: 0.0
    max_delay: 5.0
    step_up: 0.5
    step_down: 0.25
    slow_ms: 3000

  # v1.08: two-phase crawl — Phase 1 scans the core links (sitemap +
  # navigation + others) and defers known noisy patterns (pagination_deep,
  # /auth/login, filter combinations). After Phase 1 a counts panel appears + a
  # Phase 2 button to scan the deferred ones.
  deferred_crawl:
    enabled: true
    pagination_max: 3      # ?page=N greater than this is deferred
    filter_max: 1          # more filter combinations are deferred
    max_tracked: 50000     # cap on the number of deferred entries tracked
    # phase2: set automatically by the --phase2 CLI flag — do not edit it manually.

javascript:
  enabled: false
  wait_until: "networkidle"
  timeout: 10
  browser: "chromium"
  headless: true

# Accessibility check (axe-core) — optional, requires javascript.enabled (runs inside the rendered browser)
accessibility:
  enabled: false
  max_pages: 50            # cap on the number of pages axe checks
  axe_source: ""           # local path to axe.min.js (recommended for offline operation)
  cdn_url: ""              # alternate CDN URL (used only when allow_cdn; default jsdelivr)
  allow_cdn: false         # allow fetching axe-core from CDN when the local file is missing

extraction:
  extract_meta: true
  extract_headings: true
  extract_links: true
  extract_images: true
  extract_schema: true
  extract_hreflang: true
  extract_og: true
  extract_canonical: true
  extract_headers: true
  extract_content: true
  extract_resources: false
  extract_mixed_content: true
  min_content_length: 50

filters:
  exclude_patterns:
    - "/cart"
    - "/checkout"
    - "/account"
    - "/login"
    - "/logout"
    - "mailto:"
    - "tel:"
    - "javascript:"
  include_patterns: []
  allowed_content_types:
    - "text/html"
    - "application/xhtml+xml"
  respect_nofollow: false
  check_external_links: true

analysis:
  thin_content_threshold: 300
  thin_content_critical_threshold: 100
  text_ratio_threshold: 10.0
  title_max_length: 60
  title_min_length: 30
  description_max_length: 160
  description_min_length: 70
  image_max_size_kb: 200
  max_recommended_depth: 4
  url_max_length: 115
  url_max_query_params: 5

output:
  output_dir: "./output"
  formats:
    - csv
    - json
    # - xml    # duplicates CSV data (no extra info) — add only when needed
    # - html   # HTML report
    # - pdf    # PDF report (requires Playwright)
    # - excel  # requires openpyxl
  encoding: "utf-8-sig"
  timestamped_folder: true
  json_full: false       # true = include raw arrays in JSON (can be huge)
  xml_max_rows: 50000    # cap on XML rows per group (0 = unlimited)
  generate_sitemap: false  # generate sitemap.xml from indexable pages (IMP-5)

# HTML/PDF report options (used when html/pdf is added to formats)
report:
  language: "ar"          # ar | en
  client_name: ""         # shown on the report cover
  logo_url: ""            # optional logo on the cover
  max_rows: 100           # limit on table rows in the report
  unified: true           # unified report: technical + GSC + GA4 + priorities

state:
  state_dir: "./state"
  save_interval: 50
  resume_if_exists: true
  use_database: true
  cache_ttl_days: 7

external_check:
  enabled: true
  timeout: 10
  concurrent: 20
  retry_attempts: 2
  verify_ssl: true

integrations:
  gsc:
    enabled: false
    credentials_file: "credentials/gsc_credentials.json"
    site_url: "https://example.com/"
    months_back: 16
    # Real indexing status per URL via the URL Inspection API (IMP-2) — respects quota via the cap
    url_inspection: false
    inspect_max_urls: 50
  pagespeed:
    enabled: false
    api_key: ""
    max_urls: 0
    delay_seconds: 1
    cache_ttl_days: 7
    strategies:
      - mobile
      - desktop
    # Save the full raw Lighthouse report per page (for deep table extraction — IMP-17a)
    save_raw_json: false
    # Core Web Vitals trend over time from CrUX History (IMP-9) — uses the same api_key
    crux_history: false
  awt:
    enabled: false
    csv_folder: "./external_data/awt"
  # v1.04: live backlinks (Ahrefs API v3 / Majestic OpenApp) — paid.
  # The key is passed via the BACKLINKS_API_KEY env var (not written to disk).
  # For a free solution on a site you own: use awt above (CSV from Ahrefs Webmaster).
  backlinks:
    enabled: false
    provider: "ahrefs"     # ahrefs | majestic
    api_key: ""            # prefer leaving empty and using the BACKLINKS_API_KEY env
    timeout: 30
  # Import Lighthouse/PageSpeed JSON locally (no keys) — see docs/EXTERNAL_TOOLS_GUIDE
  lighthouse:
    enabled: false
    folder: "./external_data/lighthouse"
  # Google Analytics 4 (optional, with your own keys) — pip install google-analytics-data
  ga4:
    enabled: false
    property_id: ""
    credentials_file: ""
    date_range_days: 90

# Custom extraction (CSS/attr/text/regex) — disabled by default
custom_extraction:
  enabled: false
  rules: []
  # rules:
  #   - name: product_price
  #     type: css
  #     selector: ".price"
  #     extract: text
  #   - name: sku
  #     type: regex
  #     pattern: 'SKU:\s*([A-Z0-9-]+)'
  #     group: 1

logging:
  level: "INFO"
  log_dir: "./logs"
  console_output: true
  file_output: true
  max_log_size_mb: 50

observability:
  enabled: true
  log_function_calls: false
  log_url_events: false
  log_extraction_details: false
  slow_call_ms: 500

sites_to_compare:
  - url: "https://example.com/"
    label: "Example"
    is_primary: true
