# SCT public example configuration.
# Copy to config.yaml and adjust for your own website.

site:
  start_url: "https://example.com/"
  domain: "example.com"
  additional_internal_domains: []
  # قالب منصّة جاهز (IMP-11 + v1.13.5): "" أو zid | salla | shopify | woocommerce | wordpress
  # متاجر: يستبعد السلّة/الدفع/الحساب؛ wordpress: يستبعد wp-admin/feed/replytocom/author/tag.
  # يدمج الأنماط دون مسح ما تضعه أنت في filters.exclude_patterns.
  platform_preset: ""

crawl:
  max_pages: 500
  max_depth: 8
  delay_seconds: 0.5
  timeout_seconds: 15
  retry_attempts: 3
  retry_delay_seconds: 2
  respect_robots: true
  robots_failure_policy: "allow"
  # homepage | sitemap | hybrid (موصى به)
  seed_strategy: "hybrid"
  verify_ssl: true
  # السماح بزحف عناوين داخلية/loopback. اتركه false لحماية SSRF.
  allow_private_hosts: false
  concurrent_requests: 5
  user_agent: "SCTBot/1.0 (+https://github.com/your-org/simple-crawler-tool)"
  max_page_size_mb: 10
  follow_redirects: true
  max_redirect_hops: 5
  # تحكّم تكيّفي بالسرعة (IMP-10): يزيد التأخير عند 429/5xx/بطء ويتعافى تلقائياً.
  adaptive_throttle:
    enabled: false
    min_delay: 0.0
    max_delay: 5.0
    step_up: 0.5
    step_down: 0.25
    slow_ms: 3000

  # v1.08: زحف على مرحلتين — Phase 1 يفحص الروابط الأساسيّة (sitemap +
  # navigation + غيرها) ويُؤجّل الأنماط الضوضائيّة المعروفة (pagination_deep،
  # /auth/login، تركيبيّات الفلاتر). بعد Phase 1 تظهر لوحة عرض الأعداد + زرّ
  # Phase 2 لفحص المؤجَّلة.
  deferred_crawl:
    enabled: true
    pagination_max: 3      # ?page=N أكبر من هذا يُؤجَّل
    filter_max: 1          # تركيبيّات فلاتر أكثر تُؤجَّل
    max_tracked: 50000     # سقف عدد المؤجَّلة المُسجَّلة
    # phase2: تُضبط تلقائياً بـ--phase2 CLI flag — لا تعدّلها يدوياً.

javascript:
  enabled: false
  wait_until: "networkidle"
  timeout: 10
  browser: "chromium"
  headless: true

# فحص الوصولية (axe-core) — اختياري، يتطلّب javascript.enabled (يعمل داخل المتصفّح المُصيّر)
accessibility:
  enabled: false
  max_pages: 50            # سقف عدد الصفحات التي يُفحَص فيها axe
  axe_source: ""           # مسار محلي لـ axe.min.js (موصى به للعمل دون إنترنت)
  cdn_url: ""              # رابط CDN بديل (يُستعمل عند allow_cdn فقط؛ الافتراضي jsdelivr)
  allow_cdn: false         # السماح بجلب axe-core من CDN عند غياب الملف المحلي

extraction:
  extract_meta: true
  extract_headings: true
  extract_links: true
  extract_images: true
  extract_schema: true
  extract_hreflang: true
  extract_og: true
  extract_canonical: true
  extract_headers: true
  extract_content: true
  extract_resources: false
  extract_mixed_content: true
  min_content_length: 50

filters:
  exclude_patterns:
    - "/cart"
    - "/checkout"
    - "/account"
    - "/login"
    - "/logout"
    - "mailto:"
    - "tel:"
    - "javascript:"
  include_patterns: []
  allowed_content_types:
    - "text/html"
    - "application/xhtml+xml"
  respect_nofollow: false
  check_external_links: true

analysis:
  thin_content_threshold: 300
  thin_content_critical_threshold: 100
  text_ratio_threshold: 10.0
  title_max_length: 60
  title_min_length: 30
  description_max_length: 160
  description_min_length: 70
  image_max_size_kb: 200
  max_recommended_depth: 4
  url_max_length: 115
  url_max_query_params: 5

output:
  output_dir: "./output"
  formats:
    - csv
    - json
    # - xml    # يكرّر بيانات CSV (لا معلومات إضافية) — أضِفه فقط عند الحاجة
    # - html   # تقرير HTML
    # - pdf    # تقرير PDF (يحتاج Playwright)
    # - excel  # يحتاج openpyxl
  encoding: "utf-8-sig"
  timestamped_folder: true
  json_full: false       # true = ضمّن المصفوفات الخام في JSON (قد يكون ضخماً)
  xml_max_rows: 50000    # سقف صفوف XML لكل مجموعة (0 = بلا حد)
  generate_sitemap: false  # توليد sitemap.xml من الصفحات القابلة للفهرسة (IMP-5)

# خيارات تقرير HTML/PDF (تُستخدم عند إضافة html/pdf إلى formats)
report:
  language: "ar"          # ar | en
  client_name: ""         # يظهر في غلاف التقرير
  logo_url: ""            # شعار اختياري في الغلاف
  max_rows: 100           # حد صفوف الجداول في التقرير
  unified: true           # تقرير موحّد: تقني + GSC + GA4 + أولويات

state:
  state_dir: "./state"
  save_interval: 50
  resume_if_exists: true
  use_database: true
  cache_ttl_days: 7

external_check:
  enabled: true
  timeout: 10
  concurrent: 20
  retry_attempts: 2
  verify_ssl: true

integrations:
  gsc:
    enabled: false
    credentials_file: "credentials/gsc_credentials.json"
    site_url: "https://example.com/"
    months_back: 16
    # حالة الفهرسة الحقيقية لكل رابط عبر URL Inspection API (IMP-2) — يحترم الحصّة عبر السقف
    url_inspection: false
    inspect_max_urls: 50
  pagespeed:
    enabled: false
    api_key: ""
    max_urls: 0
    delay_seconds: 1
    cache_ttl_days: 7
    strategies:
      - mobile
      - desktop
    # حفظ تقرير Lighthouse الخام الكامل لكل صفحة (لاستخراج الجداول العميقة — IMP-17أ)
    save_raw_json: false
    # اتجاه Core Web Vitals عبر الزمن من CrUX History (IMP-9) — يستعمل نفس api_key
    crux_history: false
  awt:
    enabled: false
    csv_folder: "./external_data/awt"
  # v1.04: روابط خلفيّة حيّة (Ahrefs API v3 / Majestic OpenApp) — مدفوع.
  # المفتاح يُمرَّر عبر BACKLINKS_API_KEY env var (لا يُكتب على القرص).
  # للحلّ المجاني للموقع الذي تملكه: استعمل awt أعلاه (CSV من Ahrefs Webmaster).
  backlinks:
    enabled: false
    provider: "ahrefs"     # ahrefs | majestic
    api_key: ""            # يُفضَّل تركه فارغاً واستعمال BACKLINKS_API_KEY env
    timeout: 30
  # استيراد Lighthouse/PageSpeed JSON محلياً (بلا مفاتيح) — راجع docs/EXTERNAL_TOOLS_GUIDE
  lighthouse:
    enabled: false
    folder: "./external_data/lighthouse"
  # Google Analytics 4 (اختياري، بمفاتيحك) — pip install google-analytics-data
  ga4:
    enabled: false
    property_id: ""
    credentials_file: ""
    date_range_days: 90

# الاستخراج المخصّص (CSS/attr/text/regex) — معطّل افتراضياً
custom_extraction:
  enabled: false
  rules: []
  # rules:
  #   - name: product_price
  #     type: css
  #     selector: ".price"
  #     extract: text
  #   - name: sku
  #     type: regex
  #     pattern: 'SKU:\s*([A-Z0-9-]+)'
  #     group: 1

logging:
  level: "INFO"
  log_dir: "./logs"
  console_output: true
  file_output: true
  max_log_size_mb: 50

observability:
  enabled: true
  log_function_calls: false
  log_url_events: false
  log_extraction_details: false
  slow_call_ms: 500

sites_to_compare:
  - url: "https://example.com/"
    label: "Example"
    is_primary: true
