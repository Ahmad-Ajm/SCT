# تشغيل SCT بأمر واحد:  docker compose up --build
# ثم افتح:  http://127.0.0.1:8000
services:
  sct:
    build: .
    image: sct:latest
    ports:
      - "8000:8000"
    # الأسرار اختيارية: تُقرأ من .env إن وُجد (لا تُخبز في الصورة)
    env_file:
      - path: .env
        required: false
    volumes:
      # حفظ مخرجات/حالة المهام بين عمليات التشغيل
      - ./webapp_jobs:/app/webapp_jobs
      # ملفات اعتماد Google المحلية (اختياري) — للقراءة فقط
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    # v1.10-D1 (L-1): healthcheck على مستوى compose — متّسق مع HEALTHCHECK
    # المُحدَّد في Dockerfile، لكن يجعل `docker compose ps` يُظهر «healthy».
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
